[project]
name = "sluice"
version = "1.3.9"
description = "Central concurrency-metering reverse proxy for LLM APIs, reconciled against the provider's usage endpoint."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# The deterministic core (sluice.control) is stdlib-only and dep-free — enforced by the
# import-boundary test. These runtime deps belong to the proxy/usage SHELL only.
dependencies = [
    "httpx>=0.27",      # upstream client + /v1/usage poller
    "uvicorn>=0.50.2",    # ASGI server (the proxy is hand-rolled raw ASGI — no framework)
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.0",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "anyio>=4.14.2",
]
windows = [
    "pywin32>=306; platform_system == 'Windows'",
]

[project.scripts]
sluice = "sluice.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sluice"]

[tool.ruff]
line-length = 100
target-version = "py312"

# Explicit select so the lint gate is stable across ruff releases (ruff 0.16
# expanded its built-in default rule set, which broke CI). Matches the
# cert-watch / adcs-lens / gpo-lens family convention: E-core + F + I + UP + B.
# E4/E7/E9 (not full E) excludes E501 — line length is governed by line-length
# above, not the linter.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Async-lint noise that fires on normal test mechanics: condition polling
# (ASYNC110), sync setup I/O (ASYNC230), and timeout params on test helpers
# (ASYNC109). Production async correctness stays enforced under src/.
"tests/*" = ["ASYNC109", "ASYNC110", "ASYNC230"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = [
    "win32service",
    "win32serviceutil",
    "servicemanager",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
